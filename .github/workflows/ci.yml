name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: core
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: ci-meili-key
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
    env:
      DJANGO_SETTINGS_MODULE: web.config.settings_test
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      CHECKOUT_DATABASE: checkout
      TF_CORE_DATABASE: test_core
      REDIS_URL: redis://127.0.0.1:6379/0
      MEILI_URL: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ci-meili-key
      SEARCH_ENABLED: "0"
      STRIPE_GATEWAY: fake
      JWT_SECRET: ci-jwt-secret-at-least-32-bytes-long
      QR_SECRET: ci-qr-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Create the checkout database
        run: |
          uv run python - <<'PY'
          import pymysql
          conn = pymysql.connect(host="127.0.0.1", user="root", password="root")
          conn.cursor().execute("CREATE DATABASE IF NOT EXISTS checkout CHARACTER SET utf8mb4")
          conn.commit()
          PY

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy .

      - name: Check migrations are committed
        run: |
          uv run python manage.py makemigrations --check --dry-run
          uv run alembic -c api/alembic.ini upgrade head
          uv run alembic -c api/alembic.ini check

      - name: Tests + coverage
        run: uv run pytest --cov=api --cov=web --cov=worker --cov=common --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

      - name: Dependency audit
        run: |
          uv pip install pip-audit
          uv run pip-audit --skip-editable

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ticketforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
