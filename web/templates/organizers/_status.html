{% with status=state.0 label=state.1 %}{% if status == "on_sale" %}<span class="tag tag-ok tag-dot">{{ label }}</span>{% elif status == "published" %}<span class="tag tag-dot">{{ label }}</span>{% elif status == "sold_out" %}<span class="tag tag-solid">{{ label }}</span>{% elif status == "cancelled" %}<span class="tag tag-bad">{{ label }}</span>{% elif status == "draft" %}<span class="tag tag-warn">{{ label }}</span>{% else %}<span class="tag">{{ label }}</span>{% endif %}{% endwith %}
