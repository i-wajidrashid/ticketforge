{% extends "base.html" %}
{% block title %}Choose a new password | TicketForge{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-form">
    <div>
      <h1>Choose a new password</h1>
      <p class="muted">At least 10 characters, and not only numbers.</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="token" value="{{ token }}">
      <div class="field">
        <label class="field-label" for="new-password">New password</label>
        <input id="new-password" type="password" name="password1" required minlength="10" autocomplete="new-password" autofocus>
      </div>
      <div class="field">
        <label class="field-label" for="new-password-2">Type it again</label>
        <input id="new-password-2" type="password" name="password2" required minlength="10" autocomplete="new-password">
      </div>
      <button class="btn btn-lg btn-block" type="submit">Save new password</button>
    </form>
  </div>
  {% include "accounts/_auth_art.html" %}
</div>
{% endblock %}
