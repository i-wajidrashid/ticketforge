{% extends "base.html" %}
{% block title %}Choose a new password — TicketForge{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Choose a new password</h1>
  <form method="post" class="stack">
    {% csrf_token %}
    <input type="hidden" name="token" value="{{ token }}">
    <label class="field"><span>New password</span><input type="password" name="password1" required minlength="10" autocomplete="new-password"></label>
    <label class="field"><span>Confirm password</span><input type="password" name="password2" required minlength="10" autocomplete="new-password"></label>
    <button class="button" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
