[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketforge"
version = "1.0.0"
description = "TicketForge - a production-grade event ticketing platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<5.3",
  "djangorestframework>=3.15,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "django-cors-headers>=4.4,<5",
  "channels>=4.2,<5",
  "channels-redis>=4.2,<5",
  "daphne>=4.1,<5",
  "gunicorn>=23,<24",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<9",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<3",
  "pymysql>=1.1,<2",
  "alembic>=1.14,<2",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "stripe>=11,<12",
  "meilisearch>=0.33,<0.34",
  "segno>=1.6,<2",
  "fpdf2>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "pytest-cov>=6,<7",
  "hypothesis>=6.115,<7",
  "factory-boy>=3.3,<4",
  "httpx2>=2.16,<3",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "django-stubs>=5.1,<6",
  "djangorestframework-stubs>=3.15,<4",
  "types-PyMySQL>=1.1,<2",
  "locust>=2.32,<3",
]

[tool.setuptools]
[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "*.html", "*.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["web*", "api*", "worker*", "common*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "web.config.settings_test"
pythonpath = ["."]
testpaths = ["tests", "web/tests", "api/tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that need MySQL/Redis/Meilisearch containers",
  "concurrency: thread-level race tests",
  "slow: slow tests (property based, load-ish)",
]
filterwarnings = ["error::DeprecationWarning:api.*", "error::DeprecationWarning:web.*"]

[tool.coverage.run]
source = ["web", "api", "worker", "common"]
omit = [
  "*/migrations/*",
  "*/alembic/*",
  "*/tests/*",
  "*/management/commands/seed_demo_data.py",
  "*/management/commands/reindex_events.py",
  "conftest.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["web", "api", "worker", "common", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF", "S", "DJ"]
ignore = [
  "E501", "B008", "SIM117", "RUF001", "RUF012",
  "ARG001", "ARG002", "ARG005", "N818", "DJ012",
  "S105", "S106", "S107",
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "F", "I", "N", "UP", "S", "RUF100"]
"*/tests/*" = ["S101", "B017", "ARG001", "ARG002", "S105", "S106", "S110"]
"tests/*" = ["S101", "B017", "ARG001", "ARG002", "S105", "S106", "S110"]
"*/management/commands/*" = ["S311", "S112"]
"locustfile.py" = ["S311"]
"notebooks/*" = ["E", "F", "I", "S", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
exclude = ["tests/", "web/tests/", "conftest.py", ".*/migrations/", "api/alembic/"]
plugins = ["mypy_django_plugin.main"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "web.config.settings_test"

[[tool.mypy.overrides]]
module = ["api.*", "common.*", "worker.*"]
strict = true

[[tool.mypy.overrides]]
module = ["worker.*", "web.realtime.*"]
disable_error_code = ["untyped-decorator"]

[[tool.mypy.overrides]]
module = ["web.*"]
strict = false
disable_error_code = ["attr-defined", "misc"]
