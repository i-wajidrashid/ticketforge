# The TicketForge site: upstreams, security headers, rate limit and routes.
# Included inside the server block of servers.tls.conf or servers.proxied.conf.

# Resolved per request (see the resolver in nginx.conf).
set $web_upstream      http://web:8000;
set $api_upstream      http://api:8001;
set $realtime_upstream http://realtime:8002;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

limit_req zone=global burst=40 nodelay;

location /static/ {
    alias /static/;
    expires 7d;
    access_log off;
}

location /media/ {
    alias /media/;
    expires 1d;
}

# FastAPI: public + checkout API, OpenAPI docs and webhooks.
location /api/ {
    proxy_pass $api_upstream;
    include /etc/nginx/proxy_params_ticketforge.conf;
}

# Django REST Framework organizer API and Django admin.
location /org/ {
    proxy_pass $web_upstream;
    include /etc/nginx/proxy_params_ticketforge.conf;
}

location /admin/ {
    proxy_pass $web_upstream;
    include /etc/nginx/proxy_params_ticketforge.conf;
}

# WebSockets (Django Channels ASGI).
location /ws/ {
    access_log /var/log/nginx/access.log json_path_only;
    proxy_pass $realtime_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location / {
    proxy_pass $web_upstream;
    include /etc/nginx/proxy_params_ticketforge.conf;
}
