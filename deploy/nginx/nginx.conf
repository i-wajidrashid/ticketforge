worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    # WebSocket handshakes carry the access token in the query string (browsers
    # cannot set headers on them), so their log lines record the path only.
    log_format json_path_only escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Global edge rate limit (per client IP). Per-user limits live in Redis
    # inside the apps. Kept in its own file so a load test can swap it out
    # without editing this one: see docker-compose.loadtest.yml.
    include /etc/nginx/limits.conf;

    # Docker's embedded DNS. Using variables in proxy_pass forces nginx to
    # re-resolve container names, so recreating one service never leaves a
    # stale IP cached in an upstream block.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }



    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/ticketforge.crt;
        ssl_certificate_key /etc/nginx/certs/ticketforge.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;

        # Resolved per request (see the resolver above).
        set $web_upstream      http://web:8000;
        set $api_upstream      http://api:8001;
        set $realtime_upstream http://realtime:8002;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        limit_req zone=global burst=40 nodelay;

        location /static/ {
            alias /static/;
            expires 7d;
            access_log off;
        }

        location /media/ {
            alias /media/;
            expires 1d;
        }

        # FastAPI: public + checkout API, OpenAPI docs and webhooks.
        location /api/ {
            proxy_pass $api_upstream;
            include /etc/nginx/proxy_params_ticketforge.conf;
        }

        # Django REST Framework organizer API and Django admin.
        location /org/ {
            proxy_pass $web_upstream;
            include /etc/nginx/proxy_params_ticketforge.conf;
        }

        location /admin/ {
            proxy_pass $web_upstream;
            include /etc/nginx/proxy_params_ticketforge.conf;
        }

        # WebSockets (Django Channels ASGI).
        location /ws/ {
            access_log /var/log/nginx/access.log json_path_only;
            proxy_pass $realtime_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass $web_upstream;
            include /etc/nginx/proxy_params_ticketforge.conf;
        }
    }
}
