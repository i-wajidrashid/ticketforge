worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    # WebSocket handshakes carry the access token in the query string (browsers
    # cannot set headers on them), so their log lines record the path only.
    log_format json_path_only escape=json '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Global edge rate limit (per client IP). Per-user limits live in Redis
    # inside the apps. Kept in its own file so a load test can swap it out
    # without editing this one: see docker-compose.loadtest.yml.
    include /etc/nginx/limits.conf;

    # Docker's embedded DNS. Using variables in proxy_pass forces nginx to
    # re-resolve container names, so recreating one service never leaves a
    # stale IP cached in an upstream block.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Which server blocks run depends on where TLS ends. The image copies one
    # of servers.tls.conf (nginx terminates TLS, the default) or
    # servers.proxied.conf (another proxy such as Traefik terminates TLS) here.
    include /etc/nginx/servers.conf;
}
