# Another reverse proxy terminates TLS and forwards plain HTTP to port 80,
# for example Traefik under Dokploy or Coolify. nginx publishes no ports in
# this mode and is reachable only on the Docker networks.

# Take the client address from the proxy's X-Forwarded-For, so the per-IP
# rate limit and the logs see visitors instead of the proxy. Only addresses
# on private Docker networks are trusted to set it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Pass on the scheme the visitor used (https at the proxy), which Django
# needs for secure cookies, CSRF and redirects.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/ticketforge_site.conf;
}
