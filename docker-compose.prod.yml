# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before using it: replace every secret in .env, set DJANGO_DEBUG=0, point
# SITE_ORIGIN at your real domain, and do NOT publish MySQL/Redis/Meilisearch
# ports from the host (remove them or firewall them).
services:
  web:
    environment:
      DJANGO_DEBUG: "0"
      GUNICORN_WORKERS: "5"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    environment:
      UVICORN_WORKERS: "4"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  realtime:
    restart: always

  worker:
    restart: always
    environment:
      CELERY_CONCURRENCY: "8"

  beat:
    restart: always

  nginx:
    restart: always

  mysql:
    restart: always

  redis:
    restart: always

  search:
    restart: always
